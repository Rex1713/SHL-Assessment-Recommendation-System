services:
  - type: web
    name: shl-fastapi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
